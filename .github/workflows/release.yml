name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: make check
      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag is not a supported semantic version: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="sparenode_${version}_${os}_${arch}"
            staging="$(mktemp -d)"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.version=$version -X main.commit=${GITHUB_SHA:0:12}" \
              -o "$staging/spare" ./cmd/spare
            cp README.md LICENSE "$staging/"
            tar -C "$staging" -czf "dist/${name}.tar.gz" spare README.md LICENSE
          done
          cd dist
          sha256sum ./*.tar.gz > checksums.txt
      - name: Verify release binary metadata
        run: |
          archive="dist/sparenode_${GITHUB_REF_NAME#v}_linux_amd64.tar.gz"
          staging="$(mktemp -d)"
          tar -C "$staging" -xzf "$archive"
          "$staging/spare" version --json | grep -F "\"version\":\"${GITHUB_REF_NAME#v}\""
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            "${prerelease[@]}"
